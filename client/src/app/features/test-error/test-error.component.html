<div class="mt-5 flex justify-center gap-4 flex-wrap">
  <button mat-stroked-button color="warn" (click)="get500Error()">Test 500 Error</button>
  <button mat-stroked-button color="primary" (click)="get404Error()">Test 404 Error</button>
  <button mat-stroked-button color="accent" (click)="get400Error()">Test 400 Error</button>
  <button mat-stroked-button color="primary" (click)="get401Error()">Test 401 Error</button>
  <button mat-stroked-button color="warn" (click)="get400ValidationError()">Test Validation Errors</button>
</div>

@if (validationErrors?.length) {
  <div class="mx-auto mt-4 max-w-lg rounded-lg bg-red-100 p-3 shadow">
    <h3 class="text-red-700 font-semibold mb-2">Validation Errors</h3>
    <ul class="space-y-1 list-disc list-inside">
      @for (error of validationErrors; track $index) {
        <li class="text-red-800 text-sm">{{ error }}</li>
      }
    </ul>
  </div>
}
